name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64 + AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libgl-dev \
            libegl-dev \
            libdbus-1-dev \
            squashfs-tools \
            desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests & clippy
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build release binary & AppImage
        run: |
          ./scripts/build-appimage.sh
          tar -C target/release -czf dist/liebert-dynamic-island-linux-x86_64.tar.gz liebert-dynamic-island

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run tests & clippy
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings

      - name: Build Windows release binary
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/liebert-dynamic-island.exe, LICENSE.md, README.md -DestinationPath dist/liebert-dynamic-island-windows-x86_64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/liebert-dynamic-island-windows-x86_64.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
