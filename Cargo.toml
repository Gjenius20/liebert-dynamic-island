[package]
name = "liebert-dynamic-island"
version = "0.1.0"
edition = "2024"
description = "Lightweight native Rust Dynamic Island notification overlay for Windows and Linux"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
directories = "6.0"
tray-icon = { version = "0.27", default-features = false, features = ["ksni"] }
ureq = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
kakasi = "0.1"
any_ascii = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.5"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
